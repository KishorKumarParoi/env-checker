[package]
name = "env-checker-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Blazing-fast Rust secret, .env, and CI/CD quality-gate scanner with auto-purge remediation"

[dependencies]
regex = "1.11"
rayon = "1.10"
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.20"
